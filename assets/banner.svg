<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="45%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#141936"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#635bff"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7a73ff"/>
    </linearGradient>

    <!-- Flow line gradient -->
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#635bff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#635bff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Card glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 18px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .metric-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 11px;
        font-weight: 500;
        fill: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.8px;
      }
      .metric-val {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 16px;
        font-weight: 700;
        fill: #38bdf8;
      }
      /* Subtle pulse & wave animations kept strictly in background */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.08); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -80; }
      }
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      .bg-pulse-1 {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .bg-pulse-2 {
        animation: pulseGlow 8s ease-in-out infinite 2s;
        transform-origin: 1000px 240px;
      }
      .flow-stream {
        stroke-dasharray: 12 12;
        animation: dashMove 3s linear infinite;
      }
      .anim-card-1 {
        animation: floatCard 5s ease-in-out infinite;
      }
      .anim-card-2 {
        animation: floatCard 6s ease-in-out infinite 1.5s;
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)"/>

  <!-- Background Animated Atmospheric Glows -->
  <g class="bg-pulse-1">
    <circle cx="220" cy="90" r="140" fill="#635bff" opacity="0.2" filter="url(#glow)"/>
  </g>
  <g class="bg-pulse-2">
    <circle cx="1020" cy="240" r="160" fill="#00d4ff" opacity="0.16" filter="url(#glow)"/>
  </g>

  <!-- Dynamic Animated Sync Grid & Rails (Background) -->
  <g opacity="0.25">
    <line x1="60" y1="50" x2="1140" y2="50" stroke="#334155" stroke-width="1"/>
    <line x1="60" y1="170" x2="1140" y2="170" stroke="#334155" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="60" y1="290" x2="1140" y2="290" stroke="#334155" stroke-width="1"/>
  </g>

  <!-- Animated Data Streams (Underneath content) -->
  <path d="M 50 170 Q 300 110, 600 170 T 1150 170" fill="none" stroke="url(#flowGrad)" stroke-width="2.5" class="flow-stream"/>
  <path d="M 50 210 Q 350 270, 650 200 T 1150 210" fill="none" stroke="url(#flowGrad)" stroke-width="1.8" class="flow-stream" style="animation-duration: 4.5s;"/>

  <!-- Background Decorative Right Floating Cards -->
  <g class="anim-card-1" opacity="0.88">
    <rect x="910" y="45" width="230" height="90" rx="12" fill="#131d35" stroke="#2a3958" stroke-width="1.5"/>
    <circle cx="936" cy="72" r="10" fill="#635bff" opacity="0.3"/>
    <circle cx="936" cy="72" r="5" fill="#635bff"/>
    <text x="956" y="77" class="metric-label">GATEWAY SYNC</text>
    <text x="936" y="112" class="metric-val">⚡ Real-Time Webhooks</text>
  </g>

  <g class="anim-card-2" opacity="0.88">
    <rect x="880" y="160" width="260" height="115" rx="12" fill="#111c33" stroke="#253553" stroke-width="1.5"/>
    <circle cx="906" cy="190" r="10" fill="#00d4ff" opacity="0.3"/>
    <circle cx="906" cy="190" r="5" fill="#00d4ff"/>
    <text x="926" y="195" class="metric-label">TRANSACTION PIPELINE</text>
    <text x="906" y="230" class="metric-val">🔄 Bi-directional Sync</text>
    <text x="906" y="254" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Postgres • Redis • GraphQL</text>
  </g>

  <!-- Foreground Content: Unobscured Title, Subtitle & Badges -->
  <g transform="translate(65, 0)">
    <!-- Category Pill -->
    <rect x="0" y="48" width="236" height="30" rx="15" fill="#1e223d" stroke="#635bff" stroke-width="1"/>
    <circle cx="16" cy="63" r="4" fill="#00d4ff"/>
    <text x="28" y="68" class="tag-text">💳 STRIPE ECOSYSTEM DIRECTORY</text>

    <!-- Main Title -->
    <text x="0" y="128" class="title">Awesome Stripe Gateway Integration &amp; Sync ⚡</text>

    <!-- Subtitle -->
    <text x="0" y="168" class="subtitle">The definitive curated guide to Stripe gateway integration, billing engines, and data sync tools.</text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 205)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="170" height="36" rx="8" fill="#131c2e" stroke="#334155" stroke-width="1"/>
      <text x="14" y="23" class="tag-text">☁️ Commercial SaaS</text>

      <!-- Pill 2 -->
      <rect x="185" y="0" width="180" height="36" rx="8" fill="#131c2e" stroke="#334155" stroke-width="1"/>
      <text x="200" y="23" class="tag-text">🔓 Open-Source Engines</text>

      <!-- Pill 3 -->
      <rect x="380" y="0" width="170" height="36" rx="8" fill="#131c2e" stroke="#334155" stroke-width="1"/>
      <text x="394" y="23" class="tag-text">🛠️ Developer SDKs</text>

      <!-- Pill 4 -->
      <rect x="565" y="0" width="185" height="36" rx="8" fill="#131c2e" stroke="#334155" stroke-width="1"/>
      <text x="580" y="23" class="tag-text">📊 Market Dynamics</text>
    </g>

    <!-- Footer Meta Text -->
    <text x="0" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b">
      Curated with precision • Verified pricing &amp; free tiers • Star-ranked open-source solutions
    </text>
  </g>
</svg>
