m,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.metric-label{font-size:11px;font-weight:600;fill:#64748b;letter-spacing:.8px}.metric-val{font-size:15px;font-weight:700;fill:#38bdf8}.grid-line{stroke:#334155;stroke-opacity:.22;stroke-width:1}.orb1{animation:pulseOrb1 7s ease-in-out infinite;transform-origin:220px 100px}.orb2{animation:pulseOrb2 8s ease-in-out infinite 1.5s;transform-origin:1020px 240px}.flow-stream{stroke-dasharray:12 12;animation:dashCycle 3.5s linear infinite}.float-card1{animation:floatCard1 5.5s ease-in-out infinite}.float-card2{animation:floatCard2 6.5s ease-in-out infinite 1s}</style><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><g><circle cx="220" cy="100" r="150" fill="#635bff" class="orb1" filter="url(#glow)"/><circle cx="1020" cy="240" r="170" fill="#00d4ff" class="orb2" filter="url(#glow)"/><circle cx="620" cy="310" r="110" fill="#635bff" filter="url(#glow)" opacity=".12"/></g><g><line x1="50" x2="1150" y1="60" y2="60" class="grid-line"/><line x1="50" x2="1150" y1="180" y2="180" stroke-dasharray="4 8" class="grid-line"/><line x1="50" x2="1150" y1="300" y2="300" class="grid-line"/></g><path fill="none" stroke="url(#flowGrad)" stroke-width="2.5" d="M 40 180 Q 300 120, 600 180 T 1160 180" class="flow-stream"/><path fill="none" stroke="url(#flowGrad)" stroke-width="1.8" d="M 40 220 Q 350 280, 650 210 T 1160 220" class="flow-stream" style="animation-duration:5s"/><g class="float-card1" opacity=".92"><rect width="235" height="92" x="910" y="55" fill="url(#cardGrad)" stroke="#2a3958" stroke-width="1.5" rx="12"/><circle cx="936" cy="83" r="10" fill="#635bff" opacity=".3"/><circle cx="936" cy="83" r="5" fill="#635bff"/><text x="956" y="87" class="metric-label">GATEWAY SYNC</text><text x="936" y="122" class="metric-val">Real-Time Webhooks</text></g><g class="float-card2" opacity=".92"><rect width="265" height="118" x="880" y="175" fill="url(#cardGrad)" stroke="#253553" stroke-width="1.5" rx="12"/><circle c