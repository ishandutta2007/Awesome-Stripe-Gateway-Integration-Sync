<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="45%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#141936" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="stripeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#635bff" />
      <stop offset="50%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#7a73ff" />
    </linearGradient>

    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#635bff" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#00d4ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#635bff" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#17223b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filter using feMerge for complete cross-renderer compliance -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #94a3b8;
      letter-spacing: 0.1px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .metric-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #64748b;
      letter-spacing: 0.8px;
    }
    .metric-val {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 700;
      fill: #38bdf8;
    }
    .grid-line {
      stroke: #334155;
      stroke-opacity: 0.22;
      stroke-width: 1;
    }

    /* Dynamic background pulsing and flow */
    @keyframes pulseOrb1 {
      0%, 100% { transform: scale(1); opacity: 0.22; }
      50% { transform: scale(1.12); opacity: 0.45; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1); opacity: 0.18; }
      50% { transform: scale(1.15); opacity: 0.38; }
    }
    @keyframes dashCycle {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -80; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }

    .orb1 { animation: pulseOrb1 7s ease-in-out infinite; transform-origin: 220px 100px; }
    .orb2 { animation: pulseOrb2 8s ease-in-out infinite 1.5s; transform-origin: 1020px 240px; }
    .flow-stream { stroke-dasharray: 12 12; animation: dashCycle 3.5s linear infinite; }
    .float-card1 { animation: floatCard1 5.5s ease-in-out infinite; }
    .float-card2 { animation: floatCard2 6.5s ease-in-out infinite 1s; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glow Spheres (Kept strictly in background) -->
  <g>
    <circle class="orb1" cx="220" cy="100" r="150" fill="#635bff" filter="url(#glow)" />
    <circle class="orb2" cx="1020" cy="240" r="170" fill="#00d4ff" filter="url(#glow)" />
    <circle cx="620" cy="310" r="110" fill="#635bff" opacity="0.12" filter="url(#glow)" />
  </g>

  <!-- Background Grid Rails -->
  <g>
    <line x1="50" y1="60" x2="1150" y2="60" class="grid-line" />
    <line x1="50" y1="180" x2="1150" y2="180" class="grid-line" stroke-dasharray="4 8" />
    <line x1="50" y1="300" x2="1150" y2="300" class="grid-line" />
  </g>

  <!-- Animated Data Streams -->
  <path d="M 40 180 Q 300 120, 600 180 T 1160 180" fill="none" stroke="url(#flowGrad)" stroke-width="2.5" class="flow-stream" />
  <path d="M 40 220 Q 350 280, 650 210 T 1160 220" fill="none" stroke="url(#flowGrad)" stroke-width="1.8" class="flow-stream" style="animation-duration: 5s;" />

  <!-- Background Decorative Right Floating Cards -->
  <g class="float-card1" opacity="0.92">
    <rect x="910" y="55" width="235" height="92" rx="12" fill="url(#cardGrad)" stroke="#2a3958" stroke-width="1.5" />
    <circle cx="936" cy="83" r="10" fill="#635bff" opacity="0.3" />
    <circle cx="936" cy="83" r="5" fill="#635bff" />
    <text x="956" y="87" class="metric-label">GATEWAY SYNC</text>
    <text x="936" y="122" class="metric-val">Real-Time Webhooks</text>
  </g>

  <g class="float-card2" opacity="0.92">
    <rect x="880" y="175" width="265" height="118" rx="12" fill="url(#cardGrad)" stroke="#253553" stroke-width="1.5" />
    <circle cx="906" cy="205" r="10" fill="#00d4ff" opacity="0.3" />
    <circle cx="906" cy="205" r="5" fill="#00d4ff" />
    <text x="926" y="210" class="metric-label">TRANSACTION PIPELINE</text>
    <text x="906" y="245" class="metric-val">Bi-directional Sync</text>
    <text x="906" y="270" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">PostgreSQL • Redis • GraphQL</text>
  </g>

  <!-- Foreground Content: Unobscured Title, Subtitle & Pills -->
  <g transform="translate(65, 0)">
    <!-- Category Pill -->
    <rect x="0" y="48" width="248" height="32" rx="16" fill="#1e223d" stroke="#635bff" stroke-width="1" />
    <circle cx="18" cy="64" r="5" fill="#00d4ff" />
    <text x="32" y="69" class="pill-text">STRIPE ECOSYSTEM DIRECTORY</text>

    <!-- Main Title -->
    <text x="0" y="132" class="title-text">Awesome Stripe Gateway Integration &amp; Sync</text>

    <!-- Subtitle -->
    <text x="0" y="174" class="subtitle-text">The definitive curated guide to Stripe gateway integration, billing engines, and data sync tools.</text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 215)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="168" height="36" rx="8" fill="#131c2e" stroke="#334155" stroke-width="1" />
      <text x="14" y="23" class="pill-text">Commercial SaaS</text>

      <!-- Pill 2 -->
      <rect x="180" y="0" width="180" height="36" rx="8" fill="#131c2e" stroke="#334155" stroke-width="1" />
      <text x="194" y="23" class="pill-text">Open-Source Engines</text>

      <!-- Pill 3 -->
      <rect x="372" y="0" width="160" height="36" rx="8" fill="#131c2e" stroke="#334155" stroke-width="1" />
      <text x="386" y="23" class="pill-text">Developer SDKs</text>

      <!-- Pill 4 -->
      <rect x="544" y="0" width="170" height="36" rx="8" fill="#131c2e" stroke="#334155" stroke-width="1" />
      <text x="558" y="23" class="pill-text">Market Dynamics</text>
    </g>

    <!-- Footer Meta Text -->
    <text x="0" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b">
      Curated with precision • Verified pricing &amp; free tiers • Star-ranked open-source solutions
    </text>
  </g>
</svg>
